name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: jaimevendrame/ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile
          - service: whatsapp-service
            context: ./apps/whatsapp-service
            file: ./apps/whatsapp-service/Dockerfile
          - service: scraper-service
            context: .
            file: ./apps/scraper-service/Dockerfile
          - service: link-builder-worker
            context: .
            file: ./apps/link-builder-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          # Transferir compose actualizado e fazer stack deploy com nova tag
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            deploy/docker-compose.prod.yml root@$VPS_HOST:/tmp/ofertaml-compose.yml
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$VPS_HOST "
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u jaimevendrame --password-stdin
            GHCR_IMAGE_TAG=${IMAGE_TAG} \
            POSTGRES_USER=ofertaml \
            POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            POSTGRES_DB=ofertaml \
            DATABASE_URL='${{ secrets.DATABASE_URL }}' \
            BETTER_AUTH_SECRET='${{ secrets.BETTER_AUTH_SECRET }}' \
            BETTER_AUTH_URL=https://ml.cotec.net.br \
            ML_AFFILIATE_TAG='${{ secrets.ML_AFFILIATE_TAG }}' \
            INTERNAL_SERVICE_TOKEN='${{ secrets.INTERNAL_SERVICE_TOKEN }}' \
            DOMAIN=ml.cotec.net.br \
            TRAEFIK_NETWORK=network_public \
            docker stack deploy --with-registry-auth -c /tmp/ofertaml-compose.yml ofertaml
          "
