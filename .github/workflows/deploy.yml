name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: jaimevendrame/ml

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            context: .
            file: ./apps/web/Dockerfile
          - service: whatsapp-service
            context: ./apps/whatsapp-service
            file: ./apps/whatsapp-service/Dockerfile
          - service: scraper-service
            context: .
            file: ./apps/scraper-service/Dockerfile
          - service: link-builder-worker
            context: .
            file: ./apps/link-builder-worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "$SSH_PRIVATE_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no root@$VPS_HOST "
            echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u jaimevendrame --password-stdin &&
            docker service update --with-registry-auth --image ghcr.io/jaimevendrame/ml/web:${IMAGE_TAG} ofertaml_web &&
            docker service update --with-registry-auth --image ghcr.io/jaimevendrame/ml/whatsapp-service:${IMAGE_TAG} ofertaml_whatsapp &&
            docker service update --with-registry-auth --image ghcr.io/jaimevendrame/ml/scraper-service:${IMAGE_TAG} ofertaml_scraper &&
            docker service update --with-registry-auth --image ghcr.io/jaimevendrame/ml/link-builder-worker:${IMAGE_TAG} ofertaml_link-builder
          "
