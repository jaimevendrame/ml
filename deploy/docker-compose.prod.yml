networks:
  ofertaml_internal:
    driver: overlay
    attachable: true
  network_public:
    external: true

volumes:
  postgres_data:
  postgres_backups:
  whatsmeow_session:

services:
  postgres:
    image: postgres:16-alpine
    networks: [ofertaml_internal]
    volumes: [postgres_data:/var/lib/postgresql/data]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure

  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    networks: [ofertaml_internal]
    volumes: [postgres_backups:/backups]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    deploy:
      resources:
        limits:
          memory: 128M
      restart_policy:
        condition: on-failure

  web:
    image: ghcr.io/jaimevendrame/ml/web:${GHCR_IMAGE_TAG:-latest}
    networks: [ofertaml_internal, network_public]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      ML_AFFILIATE_TAG: ${ML_AFFILIATE_TAG}
      WHATSAPP_SERVICE_URL: http://whatsapp:8080
      SCRAPER_SERVICE_URL: http://scraper:8081
      LINK_BUILDER_SERVICE_URL: http://link-builder:8082
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_public"
        - "traefik.http.routers.ofertaml.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.ofertaml.entrypoints=websecure"
        - "traefik.http.routers.ofertaml.tls.certresolver=letsencrypt"
        - "traefik.http.services.ofertaml.loadbalancer.server.port=3000"
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure

  whatsapp:
    image: ghcr.io/jaimevendrame/ml/whatsapp-service:${GHCR_IMAGE_TAG:-latest}
    networks: [ofertaml_internal]
    volumes: [whatsmeow_session:/data]
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      SESSION_PATH: /data/session.db
    deploy:
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: on-failure

  scraper:
    image: ghcr.io/jaimevendrame/ml/scraper-service:${GHCR_IMAGE_TAG:-latest}
    networks: [ofertaml_internal]
    environment:
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: on-failure

  link-builder:
    image: ghcr.io/jaimevendrame/ml/link-builder-worker:${GHCR_IMAGE_TAG:-latest}
    networks: [ofertaml_internal]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
    deploy:
      resources:
        limits:
          memory: 512M
      restart_policy:
        condition: on-failure
